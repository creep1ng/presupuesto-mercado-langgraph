[project]
name = "presupuesto-mercado"
version = "0.1.0"
description = "Presupuestos de mercado con LangGraph a partir de precios publicados por supermercados colombianos"
readme = "README.md"
authors = [
    { name = "Mario Gutiérrez", email = "marioagutierrez90@gmail.com" },
    { name = "Daniel Vásquez", email = "danivasgo2702@gmail.com" },
    { name = "Ricardo Arias", email = "reariast128@proton.me" },
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.5",
    "langgraph>=1.2.19",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
]

[project.scripts]
presupuesto-mercado = "presupuesto_mercado:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
